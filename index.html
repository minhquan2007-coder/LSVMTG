<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm Lịch Sử Văn Minh </title>
    <style>
        /* --- Cập nhật màu nền một chút cho không khí mùa đông --- */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(to bottom, #d7e1ec, #ffffff); /* Nền chuyển màu nhẹ */
            padding: 20px; 
            display: flex; 
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden; /* Ẩn thanh cuộn ngang do tuyết có thể bay ra ngoài */
        }
        
        .quiz-container { 
            background: #fff; 
            width: 900px; 
            max-width: 100%; 
            padding: 30px; 
            border-radius: 15px; /* Bo tròn hơn chút */
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            z-index: 10; /* Đảm bảo hộp câu hỏi nằm trên tuyết */
            position: relative;
        }
        
        h1 { text-align: center; color: #2c3e50; }
        .stats { text-align: center; margin-bottom: 20px; font-weight: bold; color: #555; }
        
        .question-box { margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; background: #fff;}
        .question-title { background: #f1f8ff; padding: 15px; font-weight: 600; border-bottom: 1px solid #ddd; color: #003e6b; }
        
        .answer-label { display: block; padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #eee; transition: 0.2s; }
        .answer-label:hover { background: #fafafa; }
        .answer-label:last-child { border-bottom: none; }
        
        /* Màu kết quả */
        .correct { background-color: #d4edda !important; color: #155724; font-weight: bold; }
        .correct::after { content: " ✓ Đúng"; float: right; }
        .wrong { background-color: #f8d7da !important; color: #721c24; text-decoration: line-through; opacity: 0.8; }
        .wrong::after { content: " ✕ Sai"; float: right; text-decoration: none; }
        .disabled { pointer-events: none; }

        /* Nút phân trang */
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .page-btn { padding: 8px 15px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 4px; }
        .page-btn.active { background: #3498db; color: white; border-color: #3498db; }
        .page-btn:hover:not(.active) { background: #eee; }

        .nav-btn { background: #2c3e50; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; transition: background 0.3s;}
        .nav-btn:hover { background: #34495e; }
        .nav-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* --- CSS CHO HIỆU ỨNG TUYẾT RƠI --- */
        .snowflake {
            position: fixed;
            top: -50px; /* Xuất phát cao hơn vì ảnh lớn hơn */
            background-image: url(snowflake_2744-fe0f.png); 
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none; 
            z-index: 9999; /* Để tuyết rơi TRÊN CÙNG (phủ lên cả bài thi) cho đẹp, hoặc để 1 nếu muốn nằm dưới */
            opacity: 0.8;
            animation: fall linear forwards;
        }
        .description {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-style: italic;
        }
        @keyframes fall {
            to {
                /* Rơi xuống đáy màn hình và trôi dạt ngang ngẫu nhiên */
                transform: translate(var(--drift-x), 105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Đề thi LỊCH SỬ VĂN MINH THẾ GIỚI</h1>
    <p class="description">Lưu ý câu hỏi trong đây phục vụ cho mục đích ôn tập và tham khảo. Ký tên : Minh Quân </p>
    <div class="stats" id="global-stats">Đã làm: 0/306 | Đúng: 0</div>
    
    <div id="quiz-area"></div>

    <div class="pagination">
        <button class="nav-btn" id="prev-btn" onclick="changePage(-1)">❮ Trang Trước</button>
        <span id="page-info" style="align-self: center; font-weight: bold;">Trang 1</span>
        <button class="nav-btn" id="next-btn" onclick="changePage(1)">Trang Sau ❯</button>
    </div>
    
    <div style="text-align: center; margin-top: 15px;">
        Chọn trang: <select id="page-select" onchange="goToPage(this.value)"></select>
    </div>
</div>

        { q: "294. Nguyên nhân chính của sự ra đời nền văn minh công nghiệp là:", a: { A: "Phong phú về số lượng và chất lượng", B: "Có sự chuyên môn hóa cao", C: "Chi phối nhiều lĩnh vực tác động đến toàn xã hội", D: "Đáp ứng những đòi hỏi của xã hội công nghiệp" }, true: "D" },
        { q: "295. Những quy tắc cơ bản của nền văn minh công nghiệp bắt buộc phải tuân theo thứ tự là:", a: { A: "Tiêu chuẩn hóa, tập trung hóa, chuyên môn hóa, đồng bộ hóa", B: "Tiêu chuẩn hóa, chuyên môn hóa, đồng bộ hóa, tập trung hóa", C: "Tiêu chuẩn hóa, đồng bộ hóa, tập trung hóa, chuyên môn hóa", D: "Tiêu chuẩn hóa, chuyên môn hóa, tập trung hóa, đồng bộ hóa" }, true: "B" },
        { q: "296. Yêu cầu đầu tiên về những quy tắc cơ bản của nền văn minh công nghiệp là:", a: { A: "Đồng bộ hóa", B: "Tập trung hóa", C: "Tiêu chuẩn hóa", D: "Chuyên môn hóa" }, true: "C" },
        { q: "297. Người được dựng bức tượng tại kỉ niệm tại Oetxmintơ (Westminster)... với dòng chữ: Người đã nhân lên gấp bội sức mạnh của con người là:", a: { A: "Giêm Oát (James Watt)", B: "Giêm Hacgrivo", C: "Risot Accrai tơ", D: "Etmơn Cacraito" }, true: "A" },
        { q: "298. Năm 1785, có một kỹ sư sáng chế ra máy dệt đưa năng suất lên gấp 39 lần... ông là:", a: { A: "Giêm Oát", B: "Giêm Hacgrivo", C: "Risot Accraj to", D: "Etmơn Cacraito" }, true: "D" },
        { q: "299. Đến đầu thế kỉ XX, có một nhà khoa học người Pháp phát minh tính phóng xạ của uranium... đặt cơ sở đầu tiên cho lí thuyết về hạt nhân là:", a: { A: "Anhxtanh", B: "Farađây", C: "Beccoren (Antoine Becquerel)", D: "Menđêlêep" }, true: "C" },
        { q: "300. Giải thưởng Nôben đầu tiên về vật lí được trao tặng năm 1901 cho nhà khoa học:", a: { A: "Rơn-ghen (Roentgen)", B: "Farađây", C: "Becơren và ông bà Quyri", D: "Anhxtanh" }, true: "A" },
        { q: "301. Ông là nhà khoa học người Đức, với công trình nghiên cứu về Thuyết tương đối... được trao giải Nôben năm 1921:", a: { A: "Menđêlêep", B: "Faradây", C: "Beccoren", D: "Anhxtanh (Albert Einsetein)" }, true: "D" },
        { q: "302. Ông là nhà khoa học người Mĩ, phát minh ra bóng đèn điện và xây dựng nhà máy điện vào nửa sau thế kỉ XIX:", a: { A: "Edixơn (Thomas Edison)", B: "Faraday", C: "Beccoren", D: "Anhxtanh" }, true: "A" },
        { q: "303. Tác giả cuốn Luận về tự do người Anh đã nêu lên nguyên tắc: cá nhân có thể làm bất cứ điều gì không hại đến người khác...:", a: { A: "Tốccovin", B: "Giôn Min (John Stuart Mill)", C: "Vichto Huygô", D: "Lep Tônxtôi" }, true: "B" },
        { q: "304. Ông là nhà thơ và nhà văn, người đại diện cho trào lưu lãng mạn tiến bộ với các tác phẩm Nhà thờ Đức bà Paris, Những người khốn khổ...:", a: { A: "Tốccovin", B: "Giôn Min", C: "Vichto Huygô (Victor Hugo)", D: "Lep Tônxtôi" }, true: "C" },
        { q: "305. Chiến tranh và hòa bình là một bản anh hùng ca về cuộc kháng chiến của nhân dân Nga chống lại sự xâm lược của Napôlêông... Người sáng tác là:", a: { A: "Tốccơvin", B: "Giôn Min", C: "Vichto Huygô", D: "Lep Tônxtôi (Lev Tolstoy)" }, true: "D" },
        { q: "306. Ông được mệnh danh là \"Chàng khổng lồ của nghệ thuật âm nhạc phương Tây\":", a: { A: "Moda (Mozart)", B: "Bach (Johann Sebastian Bach)", C: "Bêthôven (Beethoven)", D: "Đêbuyxi (Debussy)" }, true: "B" }
    ];

    // --- PHẦN XỬ LÝ LOGIC TRẮC NGHIỆM ---
    let currentPage = 1;
    const questionsPerPage = 20;
    const totalPages = Math.ceil(allQuestions.length / questionsPerPage);
    const userAnswers = {}; 

    function renderQuiz() {
        const quizArea = document.getElementById('quiz-area');
        quizArea.innerHTML = "";
        
        const start = (currentPage - 1) * questionsPerPage;
        const end = Math.min(start + questionsPerPage, allQuestions.length);

        for (let i = start; i < end; i++) {
            const item = allQuestions[i];
            const qIndex = i;
            
            let answersHtml = "";
            for (let key in item.a) {
                let isChecked = userAnswers[qIndex] === key ? "checked" : "";
                let classResult = "";
                
                if (userAnswers[qIndex]) {
                    if (key === item.true) classResult = "correct";
                    else if (userAnswers[qIndex] === key) classResult = "wrong";
                }

                answersHtml += `
                    <label class="answer-label ${classResult} ${userAnswers[qIndex] ? 'disabled' : ''}" id="lbl-${qIndex}-${key}">
                        <input type="radio" name="q${qIndex}" value="${key}" ${isChecked} 
                            onclick="handleAnswer(${qIndex}, '${key}')"> 
                        ${key}. ${item.a[key]}
                    </label>
                `;
            }

            quizArea.innerHTML += `
                <div class="question-box" id="box-${qIndex}">
                    <div class="question-title">Câu ${i + 1}: ${item.q.replace(/^\d+\.\s*/, '')}</div>
                    <div>${answersHtml}</div>
                </div>
            `;
        }
        
        updateNavigation();
    }

    function handleAnswer(qIndex, selectedKey) {
        userAnswers[qIndex] = selectedKey;
        const item = allQuestions[qIndex];

        const allLabels = document.querySelectorAll(`#box-${qIndex} .answer-label`);
        allLabels.forEach(lbl => lbl.classList.add('disabled')); 

        const selectedLabel = document.getElementById(`lbl-${qIndex}-${selectedKey}`);
        const correctLabel = document.getElementById(`lbl-${qIndex}-${item.true}`);

        if (selectedKey === item.true) {
            selectedLabel.classList.add('correct');
        } else {
            selectedLabel.classList.add('wrong');
            correctLabel.classList.add('correct');
        }

        updateStats();
    }

    function updateStats() {
        let answered = Object.keys(userAnswers).length;
        let correct = 0;
        for (let idx in userAnswers) {
            if (userAnswers[idx] === allQuestions[idx].true) correct++;
        }
        document.getElementById('global-stats').innerText = `Đã làm: ${answered}/${allQuestions.length} | Đúng: ${correct}`;
    }

    function changePage(delta) {
        currentPage += delta;
        renderQuiz();
        document.documentElement.scrollTop = 0; 
    }

    function goToPage(page) {
        currentPage = parseInt(page);
        renderQuiz();
        document.documentElement.scrollTop = 0;
    }

    function updateNavigation() {
        document.getElementById('page-info').innerText = `Trang ${currentPage} / ${totalPages}`;
        document.getElementById('prev-btn').disabled = currentPage === 1;
        document.getElementById('next-btn').disabled = currentPage === totalPages;
        document.getElementById('page-select').value = currentPage;
    }

    // --- PHẦN XỬ LÝ HIỆU ỨNG TUYẾT RƠI ---
    function createSnowflake() {
        const snowflake = document.createElement('div');
        snowflake.classList.add('snowflake');
        
        // Ngẫu nhiên hóa vị trí, kích thước và tốc độ
        snowflake.style.left = Math.random() * 100 + 'vw';
        const size = Math.random() * 10 + 5 + 'px'; // Kích thước từ 5px đến 15px
        snowflake.style.width = size;
        snowflake.style.height = size;
        snowflake.style.opacity = Math.random() * 0.6 + 0.2; // Độ mờ từ 0.2 đến 0.8
        const duration = Math.random() * 5 + 5 + 's'; // Thời gian rơi từ 5s đến 10s
        snowflake.style.animationDuration = duration;

        // Tạo độ trôi dạt ngang ngẫu nhiên
        const drift = (Math.random() - 0.5) * 200 + 'px';
        snowflake.style.setProperty('--drift-x', drift);

        document.body.appendChild(snowflake);

        
    }

    // Khởi tạo
    (function init() {
        // Tạo options cho dropdown chọn trang
        const select = document.getElementById('page-select');
        for (let i = 1; i <= totalPages; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerHTML = `Trang ${i}`;
            select.appendChild(opt);
        }
        renderQuiz();

        // Bắt đầu hiệu ứng tuyết rơi (tạo 1 bông mỗi 200ms)
        setInterval(createSnowflake, 200);
    })();
</script>
